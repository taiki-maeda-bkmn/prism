name: PDF manager checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: PDF check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:pdf

  desktop:
    name: PDF desktop journey (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1440x1000x24" npm run test:pdf:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-desktop-test-results
          path: |
            pdf-manager/test-results/
            pdf-manager/playwright-report/
          retention-days: 7
